<!DOCTYPE html>
<html class="dark" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>FLOWMIX | Software Dj Open Source</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>

<body
  class="bg-[#050505] font-display text-white selection:bg-primary selection:text-black min-h-screen audio-grid overflow-x-hidden">
  <app-root>
    <!-- Critical CSS Preloader (Matches Angular Preloader) -->
    <style>
      .app-loading { position: fixed; inset: 0; background-color: #050505; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Courier New', monospace; color: white; transition: opacity 0.5s ease-out; }
      .app-loading-logo { font-size: 80px; color: #0dccf2; margin-bottom: 2rem; animation: pulse 2s infinite; }
      .app-loading-percent { font-size: 6rem; font-weight: 900; line-height: 1; margin: 0; letter-spacing: -0.05em; font-family: sans-serif; }
      .app-loading-bar-bg { width: 300px; max-width: 80%; h: 4px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin-top: 2rem; position: relative; height: 4px; }
      .app-loading-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; width: 0%; background: #0dccf2; animation: fakeLoad 10s ease-out forwards; }
      .app-loading-text { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; opacity: 0.6; font-size: 0.875rem; letter-spacing: 0.2em; text-transform: uppercase; }
      .app-loading-dot { width: 8px; height: 8px; background-color: #0dccf2; border-radius: 50%; animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
      
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
      @keyframes fakeLoad { 0% { width: 0%; } 20% { width: 10%; } 50% { width: 30%; } 100% { width: 40%; } }
    </style>
    
    <div class="app-loading" id="app-loading-screen">
      <!-- Fallback icon using CSS shapes if font fails -->
      <div class="app-loading-logo" style="display: flex; gap: 4px; align-items: flex-end; height: 60px;">
         <div style="width: 8px; height: 30%; background: currentColor; animation: eq 1s infinite alternate;"></div>
         <div style="width: 8px; height: 60%; background: currentColor; animation: eq 0.8s infinite alternate 0.2s;"></div>
         <div style="width: 8px; height: 100%; background: currentColor; animation: eq 1.2s infinite alternate 0.4s;"></div>
         <div style="width: 8px; height: 50%; background: currentColor; animation: eq 0.9s infinite alternate 0.1s;"></div>
      </div>
      <style> @keyframes eq { 0% { height: 20%; } 100% { height: 100%; } } </style>

      <h1 class="app-loading-percent">0%</h1>
      
      <div class="app-loading-bar-bg">
        <div class="app-loading-bar-fill"></div>
      </div>

      <div class="app-loading-text">
        <span class="app-loading-dot"></span>
        <span>INITIALIZING...</span>
      </div>
    </div>
  </app-root>

</body>

</html>
